spring:
  application:
    name: movie
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

app:
  jwt:
    # Required. Empty fallback on purpose: SecurityConfig refuses to start without it (min 32 bytes).
    secret: ${JWT_SECRET:}
    ttl: ${JWT_TTL:PT2H}
  admin:
    # The initial admin is seeded only when ADMIN_EMAIL is set; ADMIN_PASSWORD is then required.
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_NAME:Administrator}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
