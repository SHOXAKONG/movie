databaseChangeLog:
  - changeSet:
      id: 003-users
      author: movie
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: email
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: ux_users_email
              - column:
                  name: password_hash
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: VARCHAR(150)
              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
